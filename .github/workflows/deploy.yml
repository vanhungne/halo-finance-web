# ──────────────────────────────────────────────────────────────
# Halo Finance Website — Deploy to Production (Tham khảo từ Halosport)
# Trigger: Push to main/master
# Flow: Build → SCP to VPS Nginx → Verify & Reload Nginx
# ──────────────────────────────────────────────────────────────

name: "Deploy Website"

on:
  push:
    branches: [master, main]
    paths:
      - ".github/workflows/**"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: false

env:
  NODE_VERSION: "20"

jobs:
  build-and-deploy:
    name: "Build & Deploy"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save @rollup/rollup-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu lightningcss-linux-x64-gnu

      - name: Build production bundle
        env:
          VITE_APP_URL_API: ${{ secrets.VITE_APP_URL_API || 'https://trolytaichinh.vn/api/' }}
        run: npm run build

      - name: Deploy to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST || '161.248.179.175' }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          source: "dist/*"
          target: "/var/www/halo-finance-web/dist"
          strip_components: 1
          overwrite: true
          rm: true

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '161.248.179.175' }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            echo "── Checking deployment ──"
            if [ -f /var/www/halo-finance-web/dist/index.html ]; then
              echo "✅ index.html exists"
              chmod -R a+rX /var/www/halo-finance-web/dist/
              ls -la /var/www/halo-finance-web/dist/
              systemctl reload nginx
              echo "✅ Website deployed successfully!"
            else
              echo "❌ index.html not found!"
              exit 1
            fi
